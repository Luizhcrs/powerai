<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090d"/>
      <stop offset="50%" stop-color="#060608"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Line Divider Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;display=swap');
      .font-sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Geist Mono', 'SF Mono', Consolas, Monaco, monospace; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bannerBg)"/>
  <rect width="1200" height="380" rx="16" fill="url(#centerGlow)"/>
  <rect width="1200" height="380" rx="16" stroke="#1c1c24" stroke-width="1.5"/>

  <!-- Logo Mark (Isometric Faceted Cube) -->
  <g transform="translate(600, 105) scale(1.5)">
    <!-- Cube Outlines -->
    <path d="M 0 -28 L 24 -14 L 24 14 L 0 28 L -24 14 L -24 -14 Z" 
          stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
    <path d="M 0 -28 L 0 0 M 0 0 L 24 14 M 0 0 L -24 14" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Brand Title -->
  <text x="600" y="210" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="800" class="font-sans" letter-spacing="0.16em">
    P O W E R A I
  </text>

  <!-- Subtitle -->
  <text x="600" y="246" text-anchor="middle" fill="#8e8e96" font-size="16" font-weight="400" class="font-sans" letter-spacing="-0.01em">
    The invisible cognitive layer &amp; terminal copilot
  </text>

  <!-- Divider Line -->
  <line x1="380" y1="274" x2="820" y2="274" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Feature Pills -->
  <g transform="translate(600, 310)">
    <!-- Pill 1 -->
    <rect x="-240" y="-14" width="145" height="28" rx="14" fill="#121217" stroke="#22222c" stroke-width="1"/>
    <text x="-167.5" y="4" text-anchor="middle" fill="#a1a1aa" font-size="11.5" font-weight="600" class="font-mono">
      ● Local-First
    </text>

    <!-- Pill 2 -->
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#121217" stroke="#22222c" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#a1a1aa" font-size="11.5" font-weight="600" class="font-mono">
      ✦ Ollama Engine
    </text>

    <!-- Pill 3 -->
    <rect x="95" y="-14" width="145" height="28" rx="14" fill="#121217" stroke="#22222c" stroke-width="1"/>
    <text x="167.5" y="4" text-anchor="middle" fill="#a1a1aa" font-size="11.5" font-weight="600" class="font-mono">
      ✓ Zero Telemetry
    </text>
  </g>
</svg>
