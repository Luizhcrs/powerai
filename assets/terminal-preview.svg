<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>

    <!-- Box Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap');
      .font-mono { font-family: 'Geist Mono', 'SF Mono', Consolas, Monaco, monospace; }
    </style>
  </defs>

  <!-- Outer Backdrop Glow -->
  <rect x="20" y="20" width="840" height="420" rx="14" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#22222b" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 20 34 Q 20 20 34 20 L 846 20 Q 860 20 860 34 L 860 62 L 20 62 Z" fill="url(#headerGrad)"/>
  <line x1="20" y1="62" x2="860" y2="62" stroke="#22222b" stroke-width="1"/>

  <!-- Window Controls (Subtle Monochrome Traffic Lights) -->
  <circle cx="46" cy="41" r="5.5" fill="#2d2d38" stroke="#3d3d4b" stroke-width="1"/>
  <circle cx="64" cy="41" r="5.5" fill="#2d2d38" stroke="#3d3d4b" stroke-width="1"/>
  <circle cx="82" cy="41" r="5.5" fill="#2d2d38" stroke="#3d3d4b" stroke-width="1"/>

  <!-- Header Title -->
  <text x="440" y="45" text-anchor="middle" fill="#71717a" font-size="12" font-weight="500" class="font-mono" letter-spacing="0.02em">
    powerai — local inference (ollama)
  </text>

  <!-- Terminal Content -->
  <!-- Line 1: User Prompt -->
  <text x="50" y="104" font-size="14" class="font-mono" font-weight="600">
    <tspan fill="#52525c">➜ </tspan>
    <tspan fill="#a1a1aa">~/app </tspan>
    <tspan fill="#ffffff" font-weight="700">ai como ver portas de rede escutando conexões</tspan>
  </text>

  <!-- Command Proposal Box -->
  <rect x="50" y="126" width="780" height="74" rx="6" fill="#121218" stroke="#262633" stroke-width="1"/>
  <rect x="50" y="126" width="3.5" height="74" rx="1.5" fill="#ffffff"/>

  <!-- Command Text -->
  <text x="68" y="154" fill="#ffffff" font-size="15" font-weight="700" class="font-mono">
    ✦ lsof -iTCP -sTCP:LISTEN -P
  </text>

  <!-- Command Explanation -->
  <text x="68" y="180" fill="#8e8e96" font-size="12.5" font-weight="400" class="font-mono">
    ↳ Lista todos os processos ativos ouvindo em portas TCP no sistema.
  </text>

  <!-- Interactive Confirmation Dialog -->
  <rect x="50" y="214" width="780" height="42" rx="6" fill="#0d0d12" stroke="#1f1f29" stroke-width="1"/>
  <text x="68" y="240" fill="#a1a1aa" font-size="12.5" font-weight="500" class="font-mono">
    Executar comando? 
    <tspan fill="#ffffff" font-weight="700">[Enter = Sim</tspan>
    <tspan fill="#52525c"> | </tspan>
    <tspan fill="#71717a">Esc = Não]</tspan>
  </text>
  
  <rect x="740" y="222" width="76" height="26" rx="4" fill="#ffffff"/>
  <text x="778" y="239" fill="#000000" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">
    ENTER ↵
  </text>

  <!-- Execution Output Box -->
  <rect x="50" y="270" width="780" height="142" rx="6" fill="#0a0a0d" stroke="#181822" stroke-width="1"/>
  
  <text x="68" y="296" fill="#52525c" font-size="11.5" font-weight="600" class="font-mono">
    [Executando] lsof -iTCP -sTCP:LISTEN -P
  </text>

  <text x="68" y="324" fill="#71717a" font-size="12" font-weight="600" class="font-mono">
    COMMAND     PID      USER    FD   TYPE   DEVICE  NODE  NAME
  </text>

  <text x="68" y="348" fill="#a1a1aa" font-size="12" class="font-mono">
    <tspan fill="#e4e4e7">node</tspan>        49202    dev     23u  IPv4   0x7c94  0t0   TCP *:3000 (LISTEN)
  </text>

  <text x="68" y="370" fill="#a1a1aa" font-size="12" class="font-mono">
    <tspan fill="#e4e4e7">ollama</tspan>      11434    dev     12u  IPv6   0x8a92  0t0   TCP *:11434 (LISTEN)
  </text>

  <text x="68" y="392" fill="#a1a1aa" font-size="12" class="font-mono">
    <tspan fill="#e4e4e7">postgres</tspan>    5432     postgres 4u  IPv4   0x12a8  0t0   TCP *:5432 (LISTEN)
  </text>
</svg>
